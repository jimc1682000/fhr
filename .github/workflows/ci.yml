name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'
      - name: Install deps (runtime + dev)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install openpyxl
      - name: Lint and format check (ruff)
        run: |
          # 用 `python -m ruff`（= requirements-dev 釘的 ruff==0.15.18），避免抓到系統其他版本
          python -m ruff --version && python -m ruff check . && python -m ruff format --check .
      - name: Run tests with coverage (stdlib trace)
        run: |
          make coverage
      - name: Enforce coverage baseline (per-package floors)
        run: |
          python tools/check_coverage_threshold.py
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage_report
          path: |
            coverage_report
            assets/coverage.svg
