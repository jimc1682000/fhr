repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18  # 對齊 requirements-dev 的 ruff 版本，避免 format 結果分歧
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.9.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: python-type-check
        name: Python type checking
        entry: python -m mypy
        language: system
        types: [python]
        require_serial: true
        files: ^(attendance_analyzer\.py|lib/.*\.py)$
        pass_filenames: false
        args: [attendance_analyzer.py, lib/]
        # Only run if mypy is available
        stages: [pre-commit]
        verbose: true
        always_run: false

      - id: unittest
        name: unittest discover (full suite)
        # Catches refactor drift before CI. Set SKIP_TESTS=1 to bypass
        # for an emergency commit; CI will still enforce.
        entry: bash -c 'if [ "${SKIP_TESTS:-}" = "1" ]; then echo "SKIP_TESTS=1, skipping"; exit 0; fi; rm -f attendance_state.json; python3 -m unittest discover -s test -b'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true