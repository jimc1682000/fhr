version: '3.8'

services:
  fhr:
    # Default: build locally for development.
    # To run the published multi-arch image instead, comment out `build` and
    # run `docker compose pull` (image is built & pushed by CI on `v*` tags).
    build: .
    image: ghcr.io/jimc1682000/fhr:latest
    container_name: fhr
    ports:
      - "8000:8000"
    environment:
      FHR_BUILD_DIR: /app/build
      # Persist analyzer state to mounted volume
      FHR_STATE_FILE: /app/build/attendance_state.json
      # Reduce holiday API retries inside service for responsiveness
      HOLIDAY_API_MAX_RETRIES: "0"
      HOLIDAY_API_BACKOFF_BASE: "0.1"
    volumes:
      - ./build:/app/build
    restart: unless-stopped
