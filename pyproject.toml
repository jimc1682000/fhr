[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhr"
version = "1.1.0"
description = "Attendance analysis system for flexible working hours in Taiwan (CLI + web service)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jimmy Chen", email = "jimc1682000@gmail.com" }]
# Core CLI (analyze / export / import / reasons). openpyxl powers Excel export
# and gracefully falls back to CSV when unavailable.
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
# Web service (server.main:app). Mirrors requirements-service.txt.
service = [
  "fastapi>=0.112",
  "uvicorn[standard]>=0.23",
  "pydantic>=2.0",
  "python-multipart>=0.0.6",
  "openpyxl>=3.1",
]

[project.scripts]
fhr = "lib.cli:run"

[tool.hatch.build.targets.wheel]
# Explicit allow-list: ship only runtime code. `attendance_analyzer.py` is a
# core module (lib.* and server.* import Issue/IssueType/AttendanceAnalyzer/
# logger from it), so it must be included alongside the lib/ and server/
# packages. `web/` holds the frontend static assets: server/main.py resolves
# WEB_DIR relative to the installed package root and only mounts `/` when the
# directory exists, so a pip-installed `[service]` needs it in the wheel too.
# Tests, tools, and PII data files are excluded by omission.
only-include = ["attendance_analyzer.py", "lib", "server", "web"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "coverage_report",
  "build",
  "dist",
  "fhr.egg-info",
  ".venv",
  "venv",
]

[tool.ruff.lint]
# Rule selection: pyflakes + pycodestyle errors + isort + upgrades + bugbear (safe subset)
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # Allow long lines in tests/docs if needed; keep to E501 elsewhere
]

[tool.ruff.lint.per-file-ignores]
# 測試常有不可拆的固定字串（如 9 欄出勤 header）— 允許長行
"test/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["attendance_analyzer", "lib", "server", "tools", "test"]
combine-as-imports = true

[tool.ruff.format]
# 取代 black：行長度沿用 [tool.ruff] 的 line-length = 100
quote-style = "double"

[tool.commitizen]
name = "cz_conventional_commits"
# Single source of truth: [project].version (PEP 621). `cz bump` updates it.
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
annotated_tag = true
bump_message = "chore(release): bump version $current_version → $new_version"
