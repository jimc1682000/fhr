[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "coverage_report",
  "build",
  "dist",
  "fhr.egg-info",
  ".venv",
  "venv",
]

[tool.ruff.lint]
# Rule selection: pyflakes + pycodestyle errors + isort + upgrades + bugbear (safe subset)
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # Allow long lines in tests/docs if needed; keep to E501 elsewhere
]

[tool.ruff.lint.per-file-ignores]
# 測試常有不可拆的固定字串（如 9 欄出勤 header）— 允許長行
"test/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["attendance_analyzer", "lib", "server", "tools", "test"]
combine-as-imports = true

[tool.ruff.format]
# 取代 black：行長度沿用 [tool.ruff] 的 line-length = 100
quote-style = "double"

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.1.0"
version_files = [
    "pyproject.toml:version",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
annotated_tag = true
bump_message = "chore(release): bump version $current_version → $new_version"
